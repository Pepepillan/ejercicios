<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letras y Sus Colores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            color: green;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: underline;
        }
        .basicos {
            color: orange;
            font-weight: bold;
        }
        .basicos-list {
            color: red;
            font-style: italic;
        }
        .intermedios {
            color: blue;
            font-weight: bold;
            font-style: italic;
        }
        .intermedios-list {
            color: purple;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>CURSOS INTERAMERICANO</h1>
    <p class="basicos">Básicos</p>
    <ul class="basicos-list">
        <li>Windows</li>
        <li>Word</li>
        <li>Excel</li>
        <li>Power Point</li>
        <li>Access</li>
        <li>Internet</li>
    </ul>
    <p class="intermedios">Intermedios</p>
    <ol class="intermedios-list">
        <li>Php</li>
        <li>Html</li>
        <li>Dreamweaver</li>
        <li>Flash</li>
        <li>Fireworks</li>
        <li>Mysql</li>
    </ol>
</body>
</html>
