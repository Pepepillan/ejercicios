<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>tabla10</title>
</head>
<body>

<style>
        table {
            width: 60%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Lista de Periódicos y sus Dominios</h2>
    <table>
        <tr>
            <th>País</th>
            <th>Nombre del Periódico</th>
            <th>Dominio</th>
        </tr>
        <tr>
            <td rowspan="2">España</td>
            <td>El País</td>
            <td>www.elpais.com</td>
        </tr>
        <tr>
            <td>ABC</td>
            <td>www.abc.es</td>
        </tr>
        <tr>
            <td rowspan="2">México</td>
            <td>El Universal</td>
            <td>www.eluniversal.com.mx</td>
        </tr>
        <tr>
            <td>Milenio</td>
            <td>www.milenio.com</td>
        </tr>
    </table>

</body>
</html>
