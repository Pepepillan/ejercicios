<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> TablaEsp</title>
<style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>

            <th>País</th>

            <td rowspan="3">España</td>
            <td>El País Digital</td>
            <td><a href="https://www.elpais.es" target="_blank">elpais.es</a></td>
        </tr>
        <tr>
            <td>ABC</td>
            <td><a href="https://www.abc.es" target="_blank">abc.es</a></td>
        </tr>
        <tr>
            <td>El Mundo</td>
            <td><a href="https://www.elmundo.es" target="_blank">elmundo.es</a></td>
        </tr>
    </table>
</body>
</html>
